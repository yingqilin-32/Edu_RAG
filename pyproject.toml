[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-rag-lab"
version = "0.4.1"
description = "Educational RAG: original knowledge, BGE-M3 retrieval and cited answers"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "langgraph==1.2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
rag = ["FlagEmbedding==1.4.2", "torch==2.14.1"]

[tool.setuptools.package-data]
edu_rag = ["static/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

